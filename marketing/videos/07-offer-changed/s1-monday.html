<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css">
<style>
  #day { top: 360px; font-size: 60px; font-family: var(--mono); color: var(--cyan); font-weight: 600; letter-spacing: .1em; }
  #card { left: 140px; right: 140px; top: 520px; padding: 18px; }
  #card .img { height: 520px; border-radius: 20px; background: var(--grad-cta); display: grid; place-items: center; text-align: center; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 170px; line-height: .9; }
  #card .img small { display: block; font-size: 60px; }
  #card p { font-size: 36px; font-weight: 700; padding: 22px 12px 10px; }
  #to { top: 1340px; font-size: 64px; font-weight: 800; }
</style></head><body><div class="stage">
  <div class="center" id="day">MONDAY</div>
  <div class="abs card" id="card"><div class="img"><div>50%<small>OFF EVERYTHING</small></div></div><p>📣 Big Summer Sale — 50% off, this week only.</p></div>
  <div class="center" id="to">📤 Sent to <span class="hl" id="n">0</span> customers</div>
</div><script type="module">
import { film, enter, pop, count, $ } from './lib/kit.js';
film({ duration: 4.6, draw(t) {
  enter($('#day'), t, -0.3, { y: 20 });
  pop($('#card'), t, -0.1, { s: 0.7 });
  enter($('#to'), t, 1.2, { y: 20 });
  count($('#n'), t, 1.3, 1.2, 0, 5000);
} });
</script></body></html>
