<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css">
<style>
  .q { position: absolute; padding: 22px 30px; border-radius: 28px; border-top-right-radius: 8px; background: #005c4b; color: #e9edef; font-size: 36px; font-weight: 600; box-shadow: 0 20px 50px rgba(0,0,0,0.5); white-space: nowrap; }
  .q:nth-child(odd) { background: #1f2c34; border-top-right-radius: 28px; border-top-left-radius: 8px; }
  #unread { top: 300px; left: 0; right: 0; text-align: center; }
  #unread .n { display: inline-flex; align-items: center; gap: 22px; padding: 22px 44px; border-radius: 999px; background: #25d366; color: #06110f; font-family: var(--display); font-weight: 700; font-size: 72px; }
  #who { top: 1540px; font-size: 92px; }
</style></head>
<body><div class="stage">
  <div class="bg bad"><div class="grid"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
  <div id="qs"></div>
  <div class="abs" id="unread"><span class="n">💬 <span id="cnt">0</span> unread</span></div>
  <h1 class="center" id="who">Who's answering <span class="hl-bad">them?</span></h1>
</div>
<script type="module">
import { film, enter, pop, count, $, $$ } from './lib/kit.js';
const Q = [
  ['Is this in size L?', 90, 520], ['When does the sale end?', 430, 640], ['Can I stack a coupon?', 120, 790],
  ['Does it ship to Pune?', 520, 900], ['Is COD available?', 80, 1030], ['30% on the linen set too?', 360, 1140],
  ['Price for 2 pieces?', 140, 1270], ['Still in stock??', 560, 1360], ['Hello? 👋', 260, 1420], ['Can I exchange it?', 620, 560],
];
const box = $('#qs');
Q.forEach(([s, x, y]) => { const d = document.createElement('div'); d.className = 'q'; d.textContent = s; d.style.left = x + 'px'; d.style.top = y + 'px'; box.appendChild(d); });
film({ duration: 5.6, draw(t) {
  $$('.q').forEach((q, i) => { const k = pop(q, t, 0.3 + i * 0.33); q.style.transform += ` rotate(${(i % 3 - 1) * 2}deg) translateY(${Math.sin(t * 1.4 + i) * 6}px)`; });
  enter($('#unread'), t, 0.15, { y: -30 });
  count($('#cnt'), t, 0.3, 3.4, 0, 2147);
  enter($('#who'), t, 3.0, { y: 60, blur: 10 });
  const shake = t > 3.5 ? Math.sin(t * 60) * Math.exp(-(t - 3.5) * 6) * 10 : 0;
  $('#unread').style.transform += ` translateX(${shake}px)`;
} });
</script></body></html>
