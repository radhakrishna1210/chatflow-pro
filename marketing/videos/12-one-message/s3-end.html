<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="lib/themes.css">
<style>
  #title { top: 300px; font-size: 118px; padding: 0 60px; line-height: 1.08; }
  #logo { top: 900px; font-size: 84px; } #logo .mark { width: 124px; height: 124px; font-size: 70px; background: var(--grad-cta); }
  #btn { top: 1090px; } #btn .btn { font-size: 48px; padding: 30px 60px; }
  #foot { top: 1260px; font-size: 32px; color: var(--t3); font-family: var(--mono); font-weight: 600; }
</style></head><body><div class="stage">
  <h1 class="center" id="title">One message.<br>Six stops.<br><span class="hl">One platform.</span></h1>
  <div class="center" id="logo"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <div class="center" id="btn"><span class="btn">Start free →</span></div>
  <div class="center" id="foot">WhatsApp Business API · free plan · no card</div>
</div><script type="module">
import { film, enter, pop, drawWords, $ } from './lib/kit.js';
film({ theme: 'violet', duration: 7.0, draw(t) {
  drawWords($('#title'), t, 0.1, { rate: 0.22 });
  pop($('#logo'), t, 2.4);
  pop($('#btn'), t, 3.0); $('#btn').style.transform += ` scale(${1 + Math.max(0, Math.sin((t - 3.4) * 3)) * 0.04})`;
  enter($('#foot'), t, 3.4, { y: 20 });
} });
</script></body></html>
