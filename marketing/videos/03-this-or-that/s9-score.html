<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css">
<style>
  #title { top: 300px; font-size: 104px; padding: 0 70px; }
  #score { top: 640px; font-size: 260px; }
  #cmt { top: 960px; } #cmt .comment { font-size: 52px; }
  #all { top: 1150px; font-size: 54px; font-weight: 800; padding: 0 90px; line-height: 1.25; }
  #logo { top: 1400px; font-size: 76px; } #logo .mark { width: 108px; height: 108px; font-size: 62px; }
  #foot { top: 1560px; font-size: 32px; color: var(--t3); font-family: var(--mono); font-weight: 600; }
</style></head><body><div class="stage">
  <h1 class="center" id="title">All 5 on the <span class="hl">right side?</span></h1>
  <div class="center display" id="score"><span class="hl" id="n">0</span>/5</div>
  <div class="center" id="cmt"><span class="comment">💬 Comment your score</span></div>
  <div class="center" id="all">Get all five — in one platform 👇</div>
  <div class="center" id="logo"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <div class="center" id="foot">WhatsApp Business API · free plan · no card</div>
</div><script type="module">
import { film, enter, pop, count, drawWords, $ } from './lib/kit.js';
film({ duration: 7.4, draw(t) {
  drawWords($('#title'), t, -0.2, { rate: 0.07 });
  enter($('#score'), t, 0.3, { s: 0.5, y: 0 });
  count($('#n'), t, 0.4, 1.0, 0, 5);
  pop($('#cmt'), t, 1.4);
  $('#cmt').style.transform += ` scale(${1 + Math.max(0, Math.sin((t - 1.8) * 4)) * 0.04})`;
  enter($('#all'), t, 3.2, { y: 30 });
  pop($('#logo'), t, 4.6);
  enter($('#foot'), t, 5.0, { y: 20 });
} });
</script></body></html>
