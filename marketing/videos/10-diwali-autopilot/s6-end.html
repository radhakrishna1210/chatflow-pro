<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="lib/themes.css">
<style>
  #wish { top: 260px; font-size: 44px; color: var(--t2); font-weight: 700; }
  #title { top: 360px; font-size: 118px; padding: 0 60px; }
  #title .serif { font-size: 130px; }
  #logo { top: 980px; font-size: 84px; } #logo .mark { width: 124px; height: 124px; font-size: 70px; background: var(--grad-cta); }
  #btn { top: 1180px; } #btn .btn { font-size: 48px; padding: 30px 60px; }
  #foot { top: 1350px; font-size: 32px; color: var(--t3); font-family: var(--mono); font-weight: 600; }
  #diyas { top: 1460px; font-size: 90px; letter-spacing: 30px; }
</style></head><body><div class="stage">
  <div class="center" id="wish">Happy Diwali from Spandan ✨</div>
  <h1 class="center" id="title">Let your campaign <span class="serif hl">do the talking.</span></h1>
  <div class="center" id="logo"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <div class="center" id="btn"><span class="btn">Start free →</span></div>
  <div class="center" id="foot">No card · live in minutes · Meta partner</div>
  <div class="center" id="diyas"><span>🪔</span><span>🪔</span><span>🪔</span></div>
</div><script type="module">
import { film, enter, pop, drawWords, $, $$ } from './lib/kit.js';
film({ theme: 'saffron', duration: 7.5, draw(t) {
  enter($('#wish'), t, -0.2, { y: 20 });
  drawWords($('#title'), t, 0.2, { rate: 0.1 });
  pop($('#logo'), t, 1.2);
  pop($('#btn'), t, 2.0); $('#btn').style.transform += ` scale(${1 + Math.max(0, Math.sin((t - 2.4) * 3)) * 0.04})`;
  enter($('#foot'), t, 2.4, { y: 20 });
  $$('#diyas span').forEach((d, i) => { pop(d, t, 2.6 + i * 0.2); d.style.display = 'inline-block'; d.style.transform += ` translateY(${Math.sin(t * 3 + i) * 8}px)`; });
} });
</script></body></html>
