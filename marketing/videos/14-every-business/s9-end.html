<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="lib/themes.css">
<style>
  #title { top: 300px; font-size: 104px; padding: 0 60px; line-height: 1.08; }
  #title .serif { font-size: 112px; }
  #logo { top: 900px; font-size: 84px; } #logo .mark { width: 124px; height: 124px; font-size: 70px; color: #fff; }
  #btn { top: 1090px; } #btn .btn { font-size: 48px; padding: 30px 60px; }
  #foot { top: 1260px; font-size: 32px; color: var(--t3); font-family: var(--mono); font-weight: 600; }
  #row { top: 1380px; font-size: 74px; letter-spacing: 18px; }
</style></head><body><div class="stage">
  <h1 class="center" id="title">Whatever you sell, let WhatsApp <span class="serif hl">answer for itself.</span></h1>
  <div class="center" id="logo"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <div class="center" id="btn"><span class="btn">Start free →</span></div>
  <div class="center" id="foot">Free plan · no card · Meta partner</div>
  <div class="center" id="row">🛍️🎓🩺🏡🗂️✈️</div>
</div><script type="module">
import { film, enter, pop, drawWords, $ } from './lib/kit.js';
film({ theme: 'sunrise', duration: 7.2, draw(t) {
  drawWords($('#title'), t, 0.1, { rate: 0.09 });
  pop($('#logo'), t, 1.6);
  pop($('#btn'), t, 2.2); $('#btn').style.transform += ` scale(${1 + Math.max(0, Math.sin((t - 2.6) * 3)) * 0.04})`;
  enter($('#foot'), t, 2.6, { y: 20 });
  enter($('#row'), t, 3.0, { y: 30 });
} });
</script></body></html>
