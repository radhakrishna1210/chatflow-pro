<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="lib/themes.css">
<style>
  #title { top: 420px; font-size: 140px; padding: 0 60px; }
  #title .serif { font-size: 150px; }
  #icons { position: absolute; left: 0; right: 0; top: 1000px; display: flex; flex-wrap: wrap; justify-content: center; gap: 26px; padding: 0 140px; }
  #icons span { width: 200px; height: 200px; border-radius: 56px; display: grid; place-items: center; font-size: 100px; background: rgba(255,255,255,.75); box-shadow: 0 24px 50px rgba(120,40,90,.16); }
</style></head><body><div class="stage">
  <h1 class="center" id="title">One platform. <span class="serif hl">Every business.</span></h1>
  <div id="icons"><span>🛍️</span><span>🎓</span><span>🩺</span><span>🏡</span><span>🗂️</span><span>✈️</span></div>
</div><script type="module">
import { film, enter, pop, drawWords, $, $$ } from './lib/kit.js';
film({ theme: 'sunrise', duration: 4.6, draw(t) {
  drawWords($('#title'), t, -0.3, { rate: 0.12 });
  $$('#icons span').forEach((s, i) => { pop(s, t, 1.0 + i * 0.15, { s: 0.3 }); s.style.transform += ` translateY(${Math.sin(t * 2 + i) * 10}px)`; });
} });
</script></body></html>
