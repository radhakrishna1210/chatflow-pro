<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="lib/themes.css">
<style>
  #title { top: 380px; font-size: 118px; padding: 0 60px; }
  #logo { top: 880px; font-size: 84px; } #logo .mark { width: 124px; height: 124px; font-size: 70px; color: #fff; }
  #btn { top: 1080px; } #btn .btn { font-size: 48px; padding: 30px 60px; }
  #foot { top: 1250px; font-size: 32px; color: var(--t3); font-family: var(--mono); font-weight: 600; }
  #ticks { position: absolute; left: 0; right: 0; top: 1380px; display: flex; justify-content: center; gap: 16px; }
  #ticks span { width: 84px; height: 84px; border-radius: 26px; background: #19b36b; color: #fff; display: grid; place-items: center; font-size: 44px; font-weight: 800; }
</style></head><body><div class="stage">
  <h1 class="center" id="title">Five steps. <span class="hl">No code.</span> Live today.</h1>
  <div class="center" id="logo"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <div class="center" id="btn"><span class="btn">Start free →</span></div>
  <div class="center" id="foot">Free plan · no card · Meta partner</div>
  <div id="ticks"><span>✓</span><span>✓</span><span>✓</span><span>✓</span><span>✓</span></div>
</div><script type="module">
import { film, enter, pop, drawWords, $, $$ } from './lib/kit.js';
film({ theme: 'day', duration: 7.0, draw(t) {
  drawWords($('#title'), t, -0.1, { rate: 0.09 });
  pop($('#logo'), t, 1.2);
  pop($('#btn'), t, 1.9); $('#btn').style.transform += ` scale(${1 + Math.max(0, Math.sin((t - 2.3) * 3)) * 0.04})`;
  enter($('#foot'), t, 2.3, { y: 20 });
  $$('#ticks span').forEach((s, i) => pop(s, t, 2.6 + i * 0.12));
} });
</script></body></html>
