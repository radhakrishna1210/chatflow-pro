<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="tour.css">
<style>
  #mk { top: 230px; } #mk .logo { font-size: 60px; } #mk .mark { width: 90px; height: 90px; font-size: 52px; }
  #title { top: 370px; font-size: 96px; padding: 0 200px; }
  #btn { top: 650px; } #btn .btn { font-size: 34px; }
  #foot { top: 790px; font-size: 24px; color: var(--t3); font-family: var(--mono); font-weight: 600; }
</style></head><body><div class="stage">
  <div class="center" id="mk"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <h1 class="center" id="title">Send the campaign. <span class="hl">Let it handle the questions.</span></h1>
  <div class="center" id="btn"><span class="btn">Start free →</span></div>
  <div class="center" id="foot">Free plan · no card · connect a number in minutes</div>
</div><script type="module">
import { film, enter, pop, drawWords, $ } from './lib/kit.js';
import { chrome } from './tour.js';
const ch = chrome(13, 8.0);
film({ duration: 8.0, draw(t) {
  ch(t);
  pop($('#mk'), t, 0.1);
  drawWords($('#title'), t, 0.3, { rate: 0.1 });
  pop($('#btn'), t, 2.8); $('#btn').style.transform += ` scale(${1 + Math.max(0, Math.sin((t - 3.2) * 3)) * 0.04})`;
  enter($('#foot'), t, 3.4, { y: 20 });
} });
</script></body></html>
