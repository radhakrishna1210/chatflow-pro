<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="tour.css">
<style>
  #mk { top: 210px; } #mk .logo { font-size: 64px; } #mk .mark { width: 96px; height: 96px; font-size: 56px; }
  #title { top: 360px; font-size: 92px; padding: 0 200px; }
  #sub { top: 600px; font-size: 32px; color: var(--t2); font-weight: 700; }
  #chips { position: absolute; left: 160px; right: 160px; top: 700px; display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
  #chips .chip { font-size: 24px; padding: 12px 22px; }
</style></head><body><div class="stage">
  <div class="center" id="mk"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <h1 class="center" id="title">Your campaign can <span class="hl">answer for itself.</span></h1>
  <div class="center" id="sub">The WhatsApp Business platform · from first number to first sale</div>
  <div id="chips"></div>
</div><script type="module">
import { film, enter, pop, drawWords, $, $$ } from './lib/kit.js';
import { chrome, CHAPTERS } from './tour.js';
CHAPTERS.slice(1, 13).forEach((c, i) => $('#chips').insertAdjacentHTML('beforeend', `<span class="chip"><span style="color:var(--cyan);font-family:var(--mono)">${String(i + 1).padStart(2, '0')}</span> ${c}</span>`));
const ch = chrome(0, 11.6);
film({ duration: 11.6, draw(t) {
  ch(t);
  pop($('#mk'), t, 0.1);
  drawWords($('#title'), t, 0.8, { rate: 0.1 });
  enter($('#sub'), t, 3.6, { y: 20 });
  $$('#chips .chip').forEach((c, i) => pop(c, t, 5.6 + i * 0.15));
} });
</script></body></html>
