<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css">
<style>
  #eye { top: 300px; font-size: 34px; }
  #q { top: 370px; font-size: 110px; padding: 0 70px; }
  #num { top: 800px; font-size: 220px; }
  #cmt { top: 1100px; } #cmt .comment { font-size: 50px; }
  #logo { top: 1360px; font-size: 64px; } #logo .mark { width: 92px; height: 92px; font-size: 54px; }
  #foot { top: 1490px; font-size: 32px; color: var(--t3); font-family: var(--mono); font-weight: 600; }
</style></head><body><div class="stage">
  <div class="center eyebrow" id="eye">Clinic owners 👩‍⚕️</div>
  <h1 class="center" id="q">How many calls did you <span class="hl-bad">miss</span> today?</h1>
  <div class="center display" id="num"><span class="hl" id="n">0</span>?</div>
  <div class="center" id="cmt"><span class="comment">📞 Comment a number</span></div>
  <div class="center" id="logo"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <div class="center" id="foot">Voice AI reception + WhatsApp reminders</div>
</div><script type="module">
import { film, enter, pop, drawWords, $ } from './lib/kit.js';
film({ duration: 6, draw(t) {
  enter($('#eye'), t, -0.3, { y: 20 });
  drawWords($('#q'), t, -0.2, { rate: 0.07 });
  enter($('#num'), t, 1.4, { s: 0.6, y: 0 });
  $('#n').textContent = String([3, 7, 12, 5, 9][Math.floor(t * 6) % 5]);
  pop($('#cmt'), t, 2.8);
  pop($('#logo'), t, 3.8); enter($('#foot'), t, 4.2, { y: 20 });
} });
</script></body></html>
