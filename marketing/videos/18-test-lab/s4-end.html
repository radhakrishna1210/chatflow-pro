<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="lib/themes.css">
<style>
  #title { top: 340px; font-size: 118px; padding: 0 60px; }
  #logo { top: 900px; font-size: 80px; } #logo .logo { font-family: 'Unbounded', sans-serif; font-weight: 800; } #logo .mark { width: 120px; height: 120px; font-size: 66px; background: var(--grad-cta); }
  #btn { top: 1090px; } #btn .btn { font-size: 44px; padding: 28px 56px; font-family: 'Unbounded', sans-serif; }
  #foot { top: 1260px; font-size: 30px; color: var(--t3); font-family: var(--mono); font-weight: 600; }
</style></head><body><div class="stage">
  <h1 class="center" id="title">Test it <span class="hl">before they see it.</span></h1>
  <div class="center" id="logo"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <div class="center" id="btn"><span class="btn">Start free →</span></div>
  <div class="center" id="foot">Campaign AI · Test Lab · answer analytics</div>
</div><script type="module">
import { film, enter, pop, drawWords, $ } from './lib/kit.js';
film({ theme: 'cyber', duration: 6.6, draw(t) {
  drawWords($('#title'), t, -0.1, { rate: 0.1 });
  const g = t > 1.0 && t < 1.2; $('#title').style.textShadow = g ? '-6px 0 #ff2e88, 6px 0 #2ef6ff' : '';
  pop($('#logo'), t, 1.2);
  pop($('#btn'), t, 1.8); $('#btn').style.transform += ` scale(${1 + Math.max(0, Math.sin((t - 2.2) * 3)) * 0.04})`;
  enter($('#foot'), t, 2.2, { y: 20 });
} });
</script></body></html>
