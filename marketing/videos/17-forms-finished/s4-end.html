<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="lib/themes.css">
<style>
  #title { top: 300px; font-size: 128px; padding: 0 50px; }
  #logo { top: 900px; font-size: 84px; } #logo .logo { font-family: 'Unbounded', sans-serif; font-weight: 800; } #logo .mark { width: 124px; height: 124px; font-size: 70px; background: #111; color: #ffd93d; }
  #btn { top: 1090px; } #btn .btn { font-size: 46px; padding: 30px 60px; }
  #foot { top: 1270px; font-size: 30px; color: #111; font-family: var(--mono); font-weight: 600; }
</style></head><body><div class="stage">
  <h1 class="center" id="title">Forms people actually <span style="background:#111;color:#ffd93d;padding:0 18px;border-radius:16px">finish.</span></h1>
  <div class="center" id="logo"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <div class="center" id="btn"><span class="btn">Start free →</span></div>
  <div class="center" id="foot">WhatsApp forms · validation built in · no card</div>
</div><script type="module">
import { film, enter, pop, $ } from './lib/kit.js';
film({ theme: 'pop', duration: 7.0, draw(t) {
  pop($('#title'), t, -0.2, { s: 0.7 });
  pop($('#logo'), t, 1.4);
  pop($('#btn'), t, 2.0, { rot: -8 }); $('#btn').style.transform += ` rotate(-3deg) scale(${1 + Math.max(0, Math.sin((t - 2.4) * 3)) * 0.04})`;
  enter($('#foot'), t, 2.4, { y: 20 });
} });
</script></body></html>
