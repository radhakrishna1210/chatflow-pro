<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="lib/themes.css">
<style>
  #title { top: 280px; font-size: 100px; padding: 0 60px; line-height: 1.08; }
  #langs { top: 830px; font-size: 54px; font-weight: 800; color: var(--t2); }
  #logo { top: 980px; font-size: 84px; } #logo .mark { width: 124px; height: 124px; font-size: 70px; background: var(--grad-cta); }
  #btn { top: 1170px; } #btn .btn { font-size: 48px; padding: 30px 60px; }
  #foot { top: 1340px; font-size: 32px; color: var(--t3); font-family: var(--mono); font-weight: 600; }
</style></head><body><div class="stage">
  <h1 class="center" id="title">One offer. Every language. <span class="hl">The same honest answer.</span></h1>
  <div class="center" id="langs">English · हिन्दी · Hinglish · தமிழ்</div>
  <div class="center" id="logo"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <div class="center" id="btn"><span class="btn">Start free →</span></div>
  <div class="center" id="foot">Campaign AI · free plan · no card</div>
</div><script type="module">
import { film, enter, pop, drawWords, $ } from './lib/kit.js';
film({ theme: 'ocean', duration: 7.4, draw(t) {
  drawWords($('#title'), t, 0.1, { rate: 0.12 });
  enter($('#langs'), t, 1.4, { y: 20 });
  pop($('#logo'), t, 2.0);
  pop($('#btn'), t, 2.6); $('#btn').style.transform += ` scale(${1 + Math.max(0, Math.sin((t - 3) * 3)) * 0.04})`;
  enter($('#foot'), t, 3.0, { y: 20 });
} });
</script></body></html>
