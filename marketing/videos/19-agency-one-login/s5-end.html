<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="lib/themes.css">
<style>
  #title { top: 320px; font-size: 128px; line-height: 1.02; }
  #title .serif { font-size: 140px; }
  #logo { top: 880px; font-size: 84px; } #logo .logo { font-family: 'Fraunces', serif; } #logo .mark { width: 124px; height: 124px; font-size: 70px; background: var(--grad-cta); }
  #btn { top: 1070px; } #btn .btn { font-size: 46px; padding: 28px 60px; }
  #foot { top: 1240px; font-size: 30px; color: var(--t3); font-family: var(--mono); font-weight: 600; }
</style></head><body><div class="stage">
  <h1 class="center" id="title">Ten clients.<br><span class="serif hl">One login.</span></h1>
  <div class="center" id="logo"><span class="logo"><span class="mark">S</span>Spandan</span></div>
  <div class="center" id="btn"><span class="btn">Start free →</span></div>
  <div class="center" id="foot">Spandan for agencies · separate numbers &amp; wallets</div>
</div><script type="module">
import { film, enter, pop, drawWords, $ } from './lib/kit.js';
film({ theme: 'forest', duration: 7.0, draw(t) {
  drawWords($('#title'), t, 0.1, { rate: 0.14 });
  pop($('#logo'), t, 1.4);
  pop($('#btn'), t, 2.0); $('#btn').style.transform += ` scale(${1 + Math.max(0, Math.sin((t - 2.4) * 3)) * 0.04})`;
  enter($('#foot'), t, 2.4, { y: 20 });
} });
</script></body></html>
