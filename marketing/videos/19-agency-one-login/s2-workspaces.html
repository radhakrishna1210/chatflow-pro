<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lib/brand.css"><link rel="stylesheet" href="lib/themes.css">
<style>
  #eye { top: 160px; font-size: 30px; }
  #title { top: 220px; font-size: 92px; padding: 0 60px; }
  #sw { left: 90px; right: 90px; top: 520px; padding: 18px; }
  #sw .hd { padding: 18px 20px; font-family: var(--mono); font-size: 22px; color: var(--t3); letter-spacing: .14em; }
  .ws { display: grid; grid-template-columns: 90px 1fr auto; gap: 20px; align-items: center; padding: 22px 20px; border-radius: 20px; }
  .ws .av { width: 90px; height: 90px; border-radius: 26px; display: grid; place-items: center; font-size: 48px; background: rgba(245,239,224,.1); }
  .ws h3 { font-size: 38px; } .ws p { font-family: var(--mono); font-size: 22px; color: var(--t2); margin-top: 6px; }
  .ws .w { font-family: 'Fraunces', serif; font-weight: 800; font-size: 38px; color: var(--cyan); }
  .ws.on { background: rgba(199,224,122,.14); box-shadow: inset 0 0 0 2px rgba(199,224,122,.5); }
</style></head><body><div class="stage">
  <div class="center eyebrow" id="eye">Workspace switcher</div>
  <h1 class="center" id="title">A workspace <span class="hl">per client.</span></h1>
  <div class="abs card" id="sw"><div class="hd">YOUR CLIENTS · 10 WORKSPACES</div></div>
</div><script type="module">
import { film, enter, $, $$ } from './lib/kit.js';
const C = [['🛍️', 'Bloom & Co', '2 numbers · 6 members', '₹18,400'], ['🩺', 'Glow Skin Clinic', '1 number · 3 members', '₹6,250'], ['🎓', 'Upskill Academy', '3 numbers · 9 members', '₹41,900'], ['🏡', 'Nest Realty', '1 number · 4 members', '₹9,120'], ['✈️', 'Wanderway Trips', '2 numbers · 5 members', '₹12,780']];
C.forEach(([e, n, m, w]) => $('#sw').insertAdjacentHTML('beforeend', `<div class="ws"><div class="av">${e}</div><div><h3>${n}</h3><p>${m}</p></div><span class="w">${w}</span></div>`));
film({ theme: 'forest', duration: 9.0, draw(t) {
  enter($('#eye'), t, -0.3, { y: 20 }); enter($('#title'), t, -0.2, { y: 30 });
  enter($('#sw'), t, 0.5, { y: 80 });
  const rows = $$('.ws');
  rows.forEach((r, i) => enter(r, t, 1.4 + i * 0.4, { x: 60, y: 0, d: 0.4 }));
  const cur = Math.min(4, Math.max(0, Math.floor((t - 4.2) / 0.9)));
  rows.forEach((r, i) => r.classList.toggle('on', t > 4.2 && i === cur));
} });
</script></body></html>
