##
# ChatFlow Pro — Render Blueprint (single-service deploy)
#
# One Node web service runs the Express API *and* serves the built Vite SPA
# from frontend/dist, so the frontend's relative `/api/...` calls are
# same-origin — no CORS, no rewrite rules, no VITE_API_URL.
#
# Secrets are marked `sync: false`: Render prompts for them on first apply and
# never stores them in this file. See DEPLOY.md for the full checklist.
##

# Postgres and Redis are hosted externally (Supabase / Upstash), so this
# blueprint declares no `databases:` block and no Key Value service — their
# connection strings are supplied as secrets instead.

services:
  - type: web
    name: chatflow-pro
    runtime: node
    plan: starter # free tier spins down after 15 min idle and stalls the queue workers
    rootDir: backend
    region: singapore
    healthCheckPath: /api/v1/health
    # `npm ci` is enough: backend/scripts/render-build.js runs as a postinstall
    # hook and handles `prisma generate` plus the frontend/dist build, so a
    # service created by hand in the dashboard (default build command) works too.
    buildCommand: npm ci
    # Migrations run at boot, not at build — the database isn't reachable from
    # the build step on every plan.
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000" # Render's default injected port

      # Supabase pooler, session mode (port 5432 — NOT 6543/transaction mode,
      # which breaks prepared statements and `prisma migrate deploy`).
      # DIRECT_URL is optional: scripts/prisma-cli.js defaults it to
      # DATABASE_URL, which is correct while the pooler is in session mode.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Upstash — use the `rediss://` (TLS) URL. See DEPLOY.md on the request
      # quota: three BullMQ workers poll continuously and will burn a free plan.
      - key: REDIS_URL
        sync: false

      # Same-origin single service: the SPA and the API share this URL.
      # Set both to https://<your-service>.onrender.com after the first deploy.
      - key: CLIENT_URL
        sync: false
      - key: APP_URL
        sync: false

      # --- Generated secrets ---
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # --- Required, must be supplied ---
      - key: ENCRYPTION_KEY # exactly 32 ASCII chars or 64 hex chars
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_BUSINESS_ID
        sync: false
      - key: META_WABA_ID
        sync: false
      - key: META_SYSTEM_USER_ID
        sync: false
      - key: META_SYSTEM_USER_TOKEN
        sync: false
      - key: META_DISPLAY_NAME
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- Optional integrations (leave unset to disable) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
